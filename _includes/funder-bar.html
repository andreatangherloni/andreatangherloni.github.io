{% include base_path %}

<div class="funder-bar">
  <div class="funder-bar__inner">
    <p class="funder-bar__note">
      <a href="{{ base_path }}/decode/"><strong>DECODE</strong></a> is funded by the Italian Ministry
      of University and Research (MUR) through the <em>Fondo Italiano per la Scienza</em> (FIS).
    </p>
    <div class="funder-bar__logos">
      <img class="funder-bar__logo funder-bar__logo--mur"
           src="{{ base_path }}/images/logo-mur.svg"
           alt="Ministero dell&rsquo;Universit&agrave; e della Ricerca" loading="lazy">
      <img class="funder-bar__logo funder-bar__logo--fis"
           src="{{ base_path }}/images/logo-fis.png"
           alt="Fondo Italiano per la Scienza" width="134" height="71" loading="lazy">
    </div>
  </div>
</div>

<script>
/* The bar is fixed, so the body needs bottom padding equal to its height.
   Measured, never hard-coded: a hard-coded reserve is exactly what broke the
   theme's original sticky footer once the funder logos made it taller. */
(function () {
  var bar = document.querySelector('.funder-bar');
  if (!bar) { return; }
  function sync() { document.body.style.paddingBottom = bar.offsetHeight + 'px'; }
  sync();
  window.addEventListener('resize', sync);
  window.addEventListener('load', sync);
  if (window.ResizeObserver) { new ResizeObserver(sync).observe(bar); }
})();
</script>
